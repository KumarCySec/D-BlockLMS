{% extends "base.html" %}

{% block title %}Access Forbidden - D-Block Library{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="error-page">
            <h1 class="display-1 text-muted">403</h1>
            <h2>Access Forbidden</h2>
            <p class="lead">You don't have permission to access this resource.</p>
            <p>If you believe this is an error, please contact an administrator.</p>
            <a href="{{ url_for('main.index') }}" class="btn btn-primary">Go Home</a>
        </div>
    </div>
</div>
{% endblock %}
