{% extends "base.html" %}

{% block title %}Unauthorized - D-Block Library{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="text-center">
            <h1 class="display-1 text-muted">401</h1>
            <h2>Authentication Required</h2>
            <p class="lead">You need to log in to access this resource.</p>
            <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Login</a>
            <a href="{{ url_for('main.index') }}" class="btn btn-secondary">Go Home</a>
        </div>
    </div>
</div>
{% endblock %}
